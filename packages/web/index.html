<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- The server replaces this marker before serving. It comes first on purpose:
         parsers take the first title and the first og:* they meet, so the injected
         per-listing tags have to precede the generic ones below. Left in place when
         Vite serves this file directly in development, where nothing crawls it. -->
    <!--og-->

    <title>outmine — the board you pay for with CPU</title>
    <meta name="description" content="A public leaderboard where rank is bought with browser mining instead of money." />

    <!-- The product lives on shared links; without these a shared URL renders as a
         dead grey box, which costs reach rather than looking untidy. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="outmine" />
    <meta property="og:description" content="A leaderboard you cannot buy. Rank is paid in CPU time - pick a listing and mine for it." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#fffcf5" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Body text on every page, so it is worth the connection ahead of the CSS
         finishing. The other three faces load on demand through unicode-range. -->
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Before the first paint, or a stored dark theme flashes white on load. Inline,
         so the server's CSP has to vouch for it: the nonce placeholder is filled in per
         request alongside the og tags above. Vite leaves the attribute alone and serves
         this file unrewritten in development, where there is no CSP to satisfy. -->
    <script nonce="__CSP_NONCE__">
      try {
        if (localStorage.getItem("outmine:theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').content = "#14100c";
        }
      } catch (e) {} // private mode: light theme, everything else still works
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
