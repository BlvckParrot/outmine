# The one file in this repository that is allowed to name a deployment. That is its
# entire job: it draws the "Sponsor" button on this repository, and a fork either
# rewrites it or deletes it. Everything else here stays deployment-agnostic.
#
# `custom` and nothing else, pointing at the site's own page rather than at a payment
# processor. Stripe lists "cryptocurrency mining and staking" among the businesses it
# does not serve, and every platform GitHub offers here - Sponsors included - settles
# through Stripe or PayPal. This software mines cryptocurrency. The Bitcoin address on
# /support is the channel that does not rest on somebody else's reading of that rule.
custom: ["https://outmine.lol/support"]
