# Builds the container image and pushes it to GHCR, so the host only ever pulls.
#
# Not built on the server on purpose. The wasm stage pulls emscripten/emsdk (~2 GB) and
# compiles roughly 35 C translation units at -O3 on a single thread, which is a long
# time and a lot of disk on the smallest VPS.
#
# The miner's upstream sources are submodules, so the image job checks out recursively
# and the build context carries them at the commits this repository pins. build.sh does
# no fetching at all; without the submodules it fails with the command to run.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Gate. Pushing a tagged image that does not typecheck is worse than not pushing one.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Everything except packages/wasm. mine.test.ts imports the compiled glue at module
      # scope (see createModule in packages/wasm/module.ts), so it needs a full emscripten
      # build to even load - which is the job below, and not worth doing twice. Those
      # vectors are what `bun test` covers locally after build.sh has run.
      - run: bun test packages/server packages/web packages/protocol

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        # The wasm stage compiles from packages/wasm/vendor, which are submodules. Without
        # this the build context has empty directories and build.sh stops the build.
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Lowercase and spelled out rather than ${{ github.repository }}: GHCR rejects
          # an uppercase path, and the repository name carries its capitals.
          tags: |
            ghcr.io/blvckparrot/outmine:latest
            ghcr.io/blvckparrot/outmine:${{ github.sha }}
          # The wasm layer keys on `COPY packages/wasm`, submodule contents included, so
          # any build that does not touch the miner skips the emcc run entirely - and a
          # submodule bump is exactly what should invalidate it.
          cache-from: type=gha
          cache-to: type=gha,mode=max
