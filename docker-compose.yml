# Both services log one JSON line per event to stdout, and Docker's default json-file
# driver has no size limit. On a single host that log grows into the same disk as the
# ./data bind mount below, so left unbounded it takes the database down with it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    # Built by .github/workflows/image.yml and pulled here. Building on the host means
    # a ~2 GB emscripten pull and ~35 C files through emcc -O3 on one core, and it also
    # undoes the wasm source pinning: .dockerignore exists to keep the builder's own
    # vendor/ out of the context, and a CI runner has none.
    #
    # Which build runs here is the host's to say, not this file's. `:latest` left the
    # host with no record of what it was running and no way back to the one that worked
    # - and the image job already publishes an immutable :<commit sha> tag beside it,
    # which had no consumer. This is the consumer. Deploy and rollback are both a change
    # to IMAGE_TAG in .env followed by `docker compose pull && docker compose up -d`.
    #
    # To build locally instead, swap the two lines below.
    image: ghcr.io/blvckparrot/outmine:${IMAGE_TAG:?set IMAGE_TAG in .env to a commit sha published by .github/workflows/image.yml}
    # build: .
    restart: unless-stopped
    logging: *logging
    env_file: .env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Caddy is always the single hop in front of the app in this compose file, so
      # the client address is the last X-Forwarded-For entry. Left unset, the rate
      # limiter would see Caddy's address for everyone and limit the whole site as one.
      TRUSTED_PROXIES: 1
      # Caddy forwards the original Host but the hop to the app is plain http, so a
      # URL derived from the request would advertise og:image over http and X would
      # drop the preview. Derived from SITE_ADDRESS unless set explicitly.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://${SITE_ADDRESS}}
    volumes:
      # The app runs as the image's `bun` user (uid 1000), so these directories have to
      # be writable by it on the host: `sudo chown -R 1000:1000 ./data ./backups` once,
      # before the first start. Left root-owned, the container starts and then cannot
      # open the database.
      - ./data:/app/data
      # Separate from ./data on purpose. Point this at another disk - or rsync it off
      # the host - and the backups survive something the database does not.
      - ./backups:/app/backups
    # Both follow PORT, which is read from the same .env the app gets through env_file
    # above. Pinned separately they were a third and fourth copy of the number, so
    # moving the app broke the healthcheck and Caddy's upstream at the same time.
    expose:
      - "${PORT:-3000}"
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit(await fetch('http://localhost:${PORT:-3000}/health').then(r => r.ok ? 0 : 1).catch(() => 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    # Pinned to a patch like everything else that ships - the miner has its submodule
    # SHAs, the app has bun.lock and oven/bun:1.4.0 - because a floating `caddy:2` was
    # the last thing in front of the site that could change under it without a commit
    # saying so. Moved by .github/dependabot.yml, not by whenever the host last pulled.
    image: caddy:2.11.4
    restart: unless-stopped
    logging: *logging
    # Caddy reads SITE_ADDRESS from the Caddyfile. Without it Caddy silently falls back
    # to localhost and never gets a certificate for the real domain.
    #
    # Named explicitly rather than env_file: .env, which handed the one container that
    # faces the internet the payout address, the pool password and the admin token -
    # none of which it has any use for.
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      # The app's port, for the reverse_proxy upstream in the Caddyfile - not Caddy's
      # own, which is 80/443 below. Same default as config.ts, so an unset PORT works.
      PORT: ${PORT:-3000}
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3. Caddy binds UDP/443 and advertises Alt-Svc: h3 on its own under TLS, so
      # without this every browser tries QUIC against a port nothing is published on,
      # fails, and falls back - a wasted round trip per origin to advertise nothing.
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
