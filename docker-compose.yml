services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Caddy is always the single hop in front of the app in this compose file, so
      # the client address is the last X-Forwarded-For entry. Left unset, the rate
      # limiter would see Caddy's address for everyone and limit the whole site as one.
      TRUSTED_PROXIES: 1
      # Caddy forwards the original Host but the hop to the app is plain http, so a
      # URL derived from the request would advertise og:image over http and X would
      # drop the preview. Derived from SITE_ADDRESS unless set explicitly.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://${SITE_ADDRESS}}
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit(await fetch('http://localhost:3000/health').then(r => r.ok ? 0 : 1).catch(() => 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2
    restart: unless-stopped
    # Caddy reads SITE_ADDRESS from the Caddyfile. Without this it silently falls back
    # to localhost and never gets a certificate for the real domain.
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
